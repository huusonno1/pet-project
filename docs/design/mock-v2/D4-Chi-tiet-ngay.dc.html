<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chi tiết ngày 10/10</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9365C;text-decoration:none}a:hover{color:#A82A4B}
button{font-family:inherit}
button:disabled{opacity:0.35;cursor:default}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">

  <div style="position: absolute; left: 20px; top: 50px; width: 350px; display: flex; align-items: center; gap: 12px;">
    <a href="D1-Nhat-ky.dc.html" aria-label="Quay lại Nhật ký" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(43,26,46,0.08); display: flex; align-items: center; justify-content: center; color: #2B1A2E; flex-shrink: 0;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <h1 style="margin: 0; font-size: 18px; font-weight: 700;">Thứ Bảy, 10/10/2026</h1>
      <p style="margin: 0; font-size: 13px; color: #6F5B6A;">5 kỷ niệm trong ngày</p>
    </div>
    <span aria-live="polite" style="font-size: 13px; font-weight: 700; color: #C9365C; background: #FFE6EC; border-radius: 999px; padding: 6px 12px;">{{pos}} / 5</span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 24px; top: 108px; width: 342px; display: flex; gap: 4px;">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="5">
      <span style="{{s.style}}"></span>
    </sc-for>
  </div>

  <sc-if value="{{hasPrev}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="{{prevPeek}}"></div>
  </sc-if>
  <sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="{{nextPeek}}"></div>
  </sc-if>

  <div style="position: absolute; left: 42px; top: 126px; width: 306px; height: 400px;">
    <div role="img" aria-label="{{cur.alt}}" style="{{cardStyle}}">
      <sc-if value="{{cur.isText}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: 28px; top: 70px; width: 250px; display: flex; flex-direction: column; gap: 14px; color: #5B4BC4;">
          <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6"></path></svg>
          <p style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.35; color: #2B1A2E;">{{cur.quote}}</p>
        </div>
      </sc-if>
      <span style="position: absolute; left: 14px; top: 14px; font-size: 12px; font-weight: 700; color: #C9365C; background: rgba(255,255,255,0.92); border-radius: 999px; padding: 5px 11px;">{{cur.typeLabel}}</span>
      <sc-if value="{{multiPhoto}}" hint-placeholder-val="{{true}}">
        <span style="position: absolute; right: 14px; top: 16px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(43,26,46,0.55); border-radius: 999px; padding: 4px 9px;">{{photoLabel}}</span>
      </sc-if>
      <span style="position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.92); border-radius: 999px; padding: 5px 12px 5px 5px;">
        <span style="{{cur.avatarStyle}}">{{cur.initial}}</span>
        <span style="font-size: 13px; font-weight: 600;">{{cur.who}} · {{cur.time}}</span>
      </span>
    </div>
    <button type="button" aria-label="Ảnh hoặc kỷ niệm trước" onClick="{{goPrev}}" style="position: absolute; left: 0; top: 0; width: 40%; height: 100%; border: 0; background: transparent; cursor: pointer;"></button>
    <button type="button" aria-label="Ảnh hoặc kỷ niệm tiếp theo" onClick="{{goNext}}" style="position: absolute; right: 0; top: 0; width: 60%; height: 100%; border: 0; background: transparent; cursor: pointer;"></button>
  </div>

  <div style="position: absolute; left: 24px; top: 540px; width: 342px; display: flex; align-items: center; gap: 8px;">
    <button type="button" aria-label="Kỷ niệm trước" onClick="{{prevItem}}" disabled="{{noPrev}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <p style="margin: 0; flex-grow: 1; text-align: center; font-size: 13px; color: #6F5B6A;">Vuốt ngang để xem kỷ niệm khác</p>
    <button type="button" aria-label="Kỷ niệm tiếp theo" onClick="{{nextItem}}" disabled="{{noNext}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; top: 600px; width: 342px; display: flex; flex-direction: column; gap: 6px;">
    <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4;">{{cur.caption}}</p>
    <sc-if value="{{cur.hasPlace}}" hint-placeholder-val="{{true}}">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6F5B6A;">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        {{cur.place}}
      </span>
    </sc-if>
  </div>

  <p style="position: absolute; left: 24px; top: 684px; margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">TRONG NGÀY NÀY</p>
  <div style="position: absolute; left: 24px; top: 706px; width: 342px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="5">
      <button type="button" onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; padding: 0; cursor: pointer;">
        <span style="{{t.boxStyle}}"></span>
        <span style="{{t.labelStyle}}">{{t.label}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 1, photo: 0 };
  }
  items() {
    return [
      { type: 'Hẹn hò', mood: '', short: 'Hẹn hò', caption: 'Ăn tối ở quán Ý gần Hồ Gươm', place: 'Phố Tràng Tiền · Hoàn Kiếm', who: 'Minh', time: '19:30', photos: 2, grad: ['#C9D8FF', '#A99BF0'] },
      { type: 'Khoảnh khắc', mood: 'Nhớ nhung', short: 'Khoảnh khắc', caption: 'Đi ngang quán cà phê hồi mới quen, nhớ ghê…', place: 'Cộng Cà Phê · Hoàn Kiếm', who: 'Lan', time: '14:20', photos: 3, grad: ['#FFC8B4', '#F38BA8'] },
      { type: 'Khoảnh khắc', mood: 'Biết ơn', short: 'Ghi chú', caption: 'Khoảnh khắc không ảnh', place: '', who: 'Lan', time: '21:05', photos: 1, isText: true, quote: 'Cảm ơn anh đã gọi video lúc em mệt nhất hôm nay.' },
      { type: 'Tặng quà', mood: '', short: 'Quà', caption: 'Minh tặng một bó tulip vàng', place: 'Nhà Lan', who: 'Minh', time: '20:10', photos: 1, grad: ['#FFE1A8', '#FFAE8A'] },
      { type: 'Khoảnh khắc', mood: 'Hạnh phúc', short: 'Khoảnh khắc', caption: 'Lần đầu tự làm bánh flan, hơi rỗ nhưng ngon', place: '', who: 'Lan', time: '22:40', photos: 1, grad: ['#FFD6E0', '#E9557A'] },
    ];
  }
  bg(it, photo) {
    if (it.isText) return '#EEEAFF';
    return 'linear-gradient(' + (140 + photo * 70) + 'deg, ' + it.grad[0] + ', ' + it.grad[1] + ')';
  }
  renderVals() {
    const list = this.items();
    const { idx, photo } = this.state;
    const it = list[idx];
    const last = list.length - 1;
    const goNext = () => {
      if (photo < it.photos - 1) this.setState({ photo: photo + 1 });
      else if (idx < last) this.setState({ idx: idx + 1, photo: 0 });
    };
    const goPrev = () => {
      if (photo > 0) this.setState({ photo: photo - 1 });
      else if (idx > 0) this.setState({ idx: idx - 1, photo: 0 });
    };
    const lan = it.who === 'Lan';
    const peek = (side, other) => 'position: absolute; top: 146px; width: 300px; height: 360px; border-radius: 24px; opacity: 0.55; left: ' + (side === 'prev' ? '-270px' : '360px') + '; background: ' + this.bg(other, 0) + ';';
    return {
      pos: idx + 1,
      segs: list.map((_, i) => ({ style: 'flex-grow: 1; height: 4px; border-radius: 2px; background: ' + (i <= idx ? '#E9557A' : '#EADFD9') + ';' })),
      hasPrev: idx > 0,
      hasNext: idx < last,
      noPrev: idx === 0,
      noNext: idx === last,
      prevPeek: idx > 0 ? peek('prev', list[idx - 1]) : '',
      nextPeek: idx < last ? peek('next', list[idx + 1]) : '',
      cardStyle: 'position: relative; width: 100%; height: 100%; border-radius: 28px; box-shadow: 0 16px 36px rgba(43,26,46,0.18); background: ' + this.bg(it, photo) + ';',
      cur: {
        ...it,
        isText: !!it.isText,
        hasPlace: !!it.place,
        typeLabel: it.mood ? it.type + ' · ' + it.mood : it.type,
        initial: it.who.charAt(0),
        alt: it.isText ? 'Ghi chú: ' + it.quote : 'Ảnh: ' + it.caption,
        avatarStyle: 'width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ' + (lan ? '#FFE6EC' : '#EEEAFF') + '; color: ' + (lan ? '#C9365C' : '#5B4BC4') + ';',
      },
      multiPhoto: it.photos > 1,
      photoLabel: 'Ảnh ' + (photo + 1) + '/' + it.photos,
      goNext,
      goPrev,
      nextItem: () => { if (idx < last) this.setState({ idx: idx + 1, photo: 0 }); },
      prevItem: () => { if (idx > 0) this.setState({ idx: idx - 1, photo: 0 }); },
      thumbs: list.map((t, i) => {
        const on = i === idx;
        return {
          label: t.short,
          aria: 'Mở kỷ niệm ' + (i + 1) + ': ' + t.short,
          current: on ? 'true' : 'false',
          pick: () => this.setState({ idx: i, photo: 0 }),
          boxStyle: 'display: block; width: 58px; height: 58px; border-radius: 16px; background: ' + this.bg(t, 0) + '; ' + (on ? 'outline: 3px solid #E9557A; outline-offset: 2px;' : 'opacity: 0.7;'),
          labelStyle: 'font-size: 11px; font-weight: ' + (on ? '700' : '600') + '; color: ' + (on ? '#C9365C' : '#6F5B6A') + ';',
        };
      }),
    };
  }
}
</script>
</body>
</html>
