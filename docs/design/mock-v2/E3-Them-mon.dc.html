<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm món Minh thích</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <dc-import name="E1-Nguoi-ay" hint-size="390px,844px"></dc-import>
  <a href="E1-Nguoi-ay.dc.html" aria-label="Đóng" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(43,26,46,0.45);"></a>

  <section aria-label="Thêm món Minh thích" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 24px 34px; background: #FFF8F3; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #EADFD9; align-self: center;"></div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <h2 style="margin: 0; font-size: 21px; font-weight: 700;">Thêm món Minh thích</h2>
        <span style="font-size: 13px; color: #6F5B6A;">Gợi nhớ khi cần chọn quà</span>
      </span>
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #EEEAFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;">M</span>
    </div>

    <div style="display: flex; gap: 12px;">
      <button type="button" style="font: inherit; width: 88px; height: 88px; flex-shrink: 0; border-radius: 20px; border: 1.5px dashed #E9557A; background: #FFE6EC; color: #C9365C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; cursor: pointer;">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        Ảnh món
      </button>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">DANH MỤC</p>
        <div role="radiogroup" aria-label="Danh mục" style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
            <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <label for="f-brand" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6F5B6A;">Hãng
        <input id="f-brand" value="Keychron" style="font: inherit; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF; font-size: 15px; color: #2B1A2E; width: 100%;">
      </label>
      <label for="f-name" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6F5B6A;">Tên món
        <input id="f-name" value="K2 Pro, switch nâu" style="font: inherit; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF; font-size: 15px; color: #2B1A2E; width: 100%;">
      </label>
    </div>

    <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">LINK MUA HÀNG</p>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F5B6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
      <span style="display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 700;">Shopee</span><span style="font-size: 13px; color: #6F5B6A;">shopee.vn/keychron-k2-pro…</span></span>
    </div>
    <button type="button" style="font: inherit; align-self: flex-start; border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: #C9365C; cursor: pointer;">+ Thêm link khác</button>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #EEEAFF;">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span id="f-secret" style="font-size: 15px; font-weight: 700;">Giữ bí mật</span>
        <span style="font-size: 13px; color: #6F5B6A;">Chỉ mình bạn thấy — Minh sẽ không biết</span>
      </span>
      <button type="button" role="switch" aria-checked="{{secretStr}}" aria-labelledby="f-secret" onClick="{{toggleSecret}}" style="{{trackStyle}}"><span aria-hidden="true" style="{{knobStyle}}"></span></button>
    </div>

    <a href="E1-Nguoi-ay.dc.html" style="height: 54px; border-radius: 18px; background: #C9365C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Lưu món này</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Bàn phím', secret: true };
  }
  renderVals() {
    const cats = ['Bàn phím', 'Túi', 'Son', 'Đồng hồ', '+ Khác'].map((label) => {
      const on = this.state.cat === label;
      return {
        label, checked: on ? 'true' : 'false', pick: () => this.setState({ cat: label }),
        style: 'font: inherit; height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; ' +
          (on ? 'border: 1.5px solid #C9365C; background: #C9365C; color: #FFFFFF;' : 'border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E;'),
      };
    });
    const on = this.state.secret;
    return {
      cats,
      secretStr: on ? 'true' : 'false',
      toggleSecret: () => this.setState({ secret: !on }),
      trackStyle: 'position: relative; width: 50px; height: 30px; border-radius: 15px; border: 0; padding: 0; cursor: pointer; flex-shrink: 0; background: ' + (on ? '#C9365C' : '#D9CCC6') + ';',
      knobStyle: 'position: absolute; top: 4px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; left: ' + (on ? '24px' : '4px') + ';',
    };
  }
}
</script>
</body>
</html>
