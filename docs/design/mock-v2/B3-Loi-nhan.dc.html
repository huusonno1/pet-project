<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lời nhắn với Minh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <div style="position: absolute; left: 20px; top: 52px; width: 350px; display: flex; align-items: center; gap: 12px;">
    <a href="B1-Trang-chu.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; border: 1px solid #EADFD9; display: flex; align-items: center; justify-content: center; color: #2B1A2E; flex-shrink: 0;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #EEEAFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0;">M</span>
    <span style="display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700;">Lời nhắn với Minh</h1>
      <span style="font-size: 12px; color: #6F5B6A;">Gửi kèm thông báo đến điện thoại Minh</span>
    </span>
  </div>

  <div aria-live="polite" style="position: absolute; left: 24px; top: 116px; width: 342px; height: 500px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;">
    <p style="margin: 0; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">HÔM NAY</p>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="{{m.rowStyle}}">
        <div style="{{m.bubbleStyle}}">
          <span style="font-size: 15px; line-height: 1.45;">{{m.text}}</span>
          <span style="{{m.timeStyle}}">{{m.time}}</span>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: flex-end;">
      <div style="padding: 10px; border-radius: 20px; background: #FFE6EC; display: flex; flex-direction: column; gap: 6px;">
        <div role="img" aria-label="Hình vẽ tay trái tim" style="width: 200px; height: 110px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="60" height="60" viewBox="0 0 24 24" fill="#E9557A"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>
        </div>
        <span style="font-size: 11px; font-weight: 600; color: #C9365C;">Vẽ tay · 07:25</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 20px 34px; background: #FFFFFF; border-top: 1px solid #EADFD9; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
        <button type="button" onClick="{{q.send}}" style="font: inherit; height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 13px; font-weight: 600; cursor: pointer;">{{q.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" aria-label="Vẽ tay" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFE6EC; color: #C9365C; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
      <label for="note-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Nhắn cho Minh</label>
      <input id="note-input" placeholder="Nhắn cho Minh…" style="font: inherit; flex-grow: 1; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; border: 0; background: #F6EEEA; font-size: 15px; color: #2B1A2E;">
      <button type="button" aria-label="Gửi" onClick="{{sendDefault}}" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #C9365C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      msgs: [
        { mine: false, text: 'Chúc em ngày mới thật vui. Tối nay mình đi ăn lẩu nha!', time: '07:12' },
        { mine: true, text: 'Dạ, em đặt bàn lúc 7h nhé', time: '07:20' },
        { mine: false, text: 'Ok em, yêu em', time: '07:21' },
      ],
    };
  }
  renderVals() {
    const add = (text) => this.setState({ msgs: this.state.msgs.concat([{ mine: true, text, time: 'Vừa xong' }]).slice(-4) });
    const msgs = this.state.msgs.map((m) => ({
      ...m,
      rowStyle: 'display: flex; justify-content: ' + (m.mine ? 'flex-end' : 'flex-start') + ';',
      bubbleStyle: 'max-width: 250px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; ' +
        (m.mine ? 'background: #C9365C; color: #FFFFFF; border-radius: 20px 20px 6px 20px;' : 'background: #FFFFFF; color: #2B1A2E; border-radius: 20px 20px 20px 6px;'),
      timeStyle: 'font-size: 11px; font-weight: 600; color: ' + (m.mine ? '#FFE6EC' : '#6F5B6A') + ';',
    }));
    const quick = ['Nhớ anh', 'Anh ăn chưa?', 'Yêu anh'].map((label) => ({ label, send: () => add(label) }));
    return { msgs, quick, sendDefault: () => add('Tối nay gọi video nha') };
  }
}
</script>
</body>
</html>
