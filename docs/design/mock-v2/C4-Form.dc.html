<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'Kỷ niệm' };
  }
  renderVals() {
    const types = ['Kỷ niệm', 'Lịch hẹn', 'Tặng quà', 'Khác'].map((label) => {
      const on = this.state.type === label;
      return {
        label,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ type: label }),
        style: 'font: inherit; height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; ' +
          (on ? 'border: 1.5px solid #C9365C; background: #C9365C; color: #FFFFFF;' : 'border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E;'),
      };
    });
    return { types };
  }
}
</script>
