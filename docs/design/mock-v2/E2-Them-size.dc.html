<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm size cho Minh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <dc-import name="E1-Nguoi-ay" hint-size="390px,844px"></dc-import>
  <a href="E1-Nguoi-ay.dc.html" aria-label="Đóng" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(43,26,46,0.45);"></a>

  <section aria-label="Thêm size cho Minh" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 24px 34px; background: #FFF8F3; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #EADFD9; align-self: center;"></div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <h2 style="margin: 0; font-size: 21px; font-weight: 700;">Thêm size cho Minh</h2>
        <span style="font-size: 13px; color: #6F5B6A;">Để chọn quà vừa vặn</span>
      </span>
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #EEEAFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;">M</span>
    </div>

    <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">LOẠI</p>
    <div role="radiogroup" aria-label="Loại" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="7">
        <button type="button" role="radio" aria-checked="{{k.checked}}" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button>
      </sc-for>
    </div>

    <p style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">SIZE</p>
    <div role="radiogroup" aria-label="Size" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{sizes}}" as="s" hint-placeholder-count="6">
        <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>

    <label for="sz-other" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6F5B6A;">Hoặc nhập size khác
      <input id="sz-other" placeholder="VD: 170/88A, 42.5…" style="font: inherit; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF; font-size: 15px; color: #2B1A2E;">
    </label>
    <label for="sz-note" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6F5B6A;">Ghi chú
      <input id="sz-note" value="Thích form rộng, cổ tròn" style="font: inherit; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF; font-size: 15px; color: #2B1A2E;">
    </label>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #EEEAFF;">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span id="sz-secret" style="font-size: 15px; font-weight: 700;">Giữ bí mật</span>
        <span style="font-size: 13px; color: #6F5B6A;">Chỉ mình bạn thấy — Minh sẽ không biết</span>
      </span>
      <button type="button" role="switch" aria-checked="{{secretStr}}" aria-labelledby="sz-secret" onClick="{{toggleSecret}}" style="{{trackStyle}}"><span aria-hidden="true" style="{{knobStyle}}"></span></button>
    </div>

    <a href="E1-Nguoi-ay.dc.html" style="height: 54px; border-radius: 18px; background: #C9365C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Lưu size</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'Áo', size: 'L', secret: true };
  }
  renderVals() {
    const chip = (on) => 'font: inherit; height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; ' +
      (on ? 'border: 1.5px solid #C9365C; background: #C9365C; color: #FFFFFF;' : 'border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E;');
    const kinds = ['Áo', 'Quần', 'Giày', 'Nhẫn', 'Vòng tay', 'Vòng cổ', '+ Khác'].map((label) => ({
      label, checked: this.state.kind === label ? 'true' : 'false', pick: () => this.setState({ kind: label }), style: chip(this.state.kind === label),
    }));
    const sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'].map((label) => {
      const on = this.state.size === label;
      return {
        label, checked: on ? 'true' : 'false', pick: () => this.setState({ size: label }),
        style: 'font: inherit; height: 48px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 700; ' +
          (on ? 'border: 1.5px solid #C9365C; background: #C9365C; color: #FFFFFF;' : 'border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E;'),
      };
    });
    const on = this.state.secret;
    return {
      kinds, sizes,
      secretStr: on ? 'true' : 'false',
      toggleSecret: () => this.setState({ secret: !on }),
      trackStyle: 'position: relative; width: 50px; height: 30px; border-radius: 15px; border: 0; padding: 0; cursor: pointer; flex-shrink: 0; background: ' + (on ? '#C9365C' : '#D9CCC6') + ';',
      knobStyle: 'position: absolute; top: 4px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; left: ' + (on ? '24px' : '4px') + ';',
    };
  }
}
</script>
</body>
</html>
