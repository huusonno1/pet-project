<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <div style="position: absolute; left: 20px; top: 52px; width: 350px; display: flex; align-items: center; justify-content: space-between;">
    <button type="button" aria-label="Đèn flash" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"></path></svg></button>
    <button type="button" style="font: inherit; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 15px; font-weight: 700; cursor: pointer;">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #EEEAFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800;">M</span>
      Chia sẻ với Minh
    </button>
    <button type="button" aria-label="Đổi camera" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"></path></svg></button>
  </div>

  <div role="img" aria-label="Khung camera" style="position: absolute; left: 16px; top: 112px; width: 358px; height: 358px; border-radius: 56px; overflow: hidden; background: linear-gradient(135deg, #FFD3B8, #E98BA5); box-shadow: 0 14px 30px rgba(43,26,46,0.15);">
    <span style="position: absolute; left: 119px; top: 92px; width: 120px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.35);"></span>
    <span style="position: absolute; left: 59px; top: 240px; width: 240px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.28);"></span>
    <span style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(43,26,46,0.45); color: #FFFFFF; font-size: 12px; font-weight: 700;">{{effectName}}</span>
  </div>

  <div style="position: absolute; left: 40px; top: 486px; width: 310px; height: 92px; display: flex; align-items: center; justify-content: space-between;">
    <a href="C2-Xem-truoc.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #6F5B6A; text-decoration: none;">
      <span style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; border: 3px solid #FFFFFF; background: linear-gradient(140deg, #FFE1A8, #FFAE8A); box-shadow: 0 4px 10px rgba(43,26,46,0.12);"></span>
      Thư viện
    </a>
    <a href="C2-Xem-truoc.dc.html" aria-label="Chụp ảnh" style="width: 84px; height: 84px; box-sizing: border-box; border-radius: 42px; border: 5px solid #E9557A; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <span style="width: 62px; height: 62px; border-radius: 31px; background: #E9557A;"></span>
    </a>
    <a href="C3-Phan-loai.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #6F5B6A; text-decoration: none;">
      <span style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 24px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>
      Không ảnh
    </a>
  </div>

  <div role="radiogroup" aria-label="Hiệu ứng" style="position: absolute; left: 0; top: 598px; width: 390px; box-sizing: border-box; padding: 0 20px; display: flex; justify-content: space-between;">
    <sc-for list="{{effects}}" as="e" hint-placeholder-count="6">
      <button type="button" role="radio" aria-checked="{{e.checked}}" onClick="{{e.pick}}" style="font: inherit; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;">
        <span style="{{e.circleStyle}}"></span>
        <span style="{{e.labelStyle}}">{{e.label}}</span>
      </button>
    </sc-for>
  </div>

  <p style="position: absolute; left: 0; top: 700px; width: 390px; margin: 0; text-align: center; font-size: 13px; color: #6F5B6A;">Vuốt lên xem ảnh đã chia sẻ</p>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px;">
    <dc-import name="TabBar" active="create" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { effect: 'Lấp lánh' };
  }
  renderVals() {
    const list = [
      ['Gốc', '#EFE6E8', '#E3D6DA'], ['Mịn da', '#FFC9B9', '#F59AB1'], ['Tai thỏ', '#FFE3F0', '#F7A8CC'],
      ['Tim bay', '#FF8FAB', '#E9557A'], ['Lấp lánh', '#C9B8FF', '#7E6BE0'], ['Film', '#E9C9A8', '#8E6A4E'],
    ];
    const effects = list.map(([label, a, b]) => {
      const on = this.state.effect === label;
      return {
        label,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ effect: label }),
        circleStyle: 'display: block; width: 48px; height: 48px; box-sizing: border-box; border-radius: 24px; background: linear-gradient(135deg, ' + a + ', ' + b + '); border: ' + (on ? '3px solid #C9365C' : '0') + ';',
        labelStyle: 'font-size: 11px; font-weight: ' + (on ? '700' : '600') + '; color: ' + (on ? '#C9365C' : '#6F5B6A') + ';',
      };
    });
    return { effects, effectName: 'Hiệu ứng: ' + this.state.effect };
  }
}
</script>
</body>
</html>
