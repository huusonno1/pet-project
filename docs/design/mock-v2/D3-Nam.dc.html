<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhật ký — Năm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <div style="position: absolute; left: 24px; top: 52px; width: 342px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800;">Nhật ký</h1>
        <p style="margin: 0; font-size: 13px; color: #6F5B6A;">48 khoảnh khắc của Lan &amp; Minh</p>
      </div>
      <button type="button" aria-label="Tìm kiếm" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; box-shadow: 0 4px 12px rgba(43,26,46,0.08); display: flex; align-items: center; justify-content: center; color: #2B1A2E; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
    </div>

    <div role="tablist" aria-label="Kiểu xem" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #F6EEEA;">
      <a href="D1-Nhat-ky.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6F5B6A; text-decoration: none;">Lưới</a>
      <a href="D2-Thang.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6F5B6A; text-decoration: none;">Tháng</a>
      <span role="tab" aria-selected="true" style="height: 38px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(43,26,46,0.08); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">Năm</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <button type="button" aria-label="Năm trước" style="font: inherit; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700;">2026</h2>
        <span style="font-size: 13px; color: #6F5B6A;">48 khoảnh khắc</span>
      </div>
      <button type="button" aria-label="Năm sau" style="font: inherit; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
        <a href="D2-Thang.dc.html" aria-label="{{m.aria}}" style="{{m.cardStyle}}">
          <span style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="{{m.titleStyle}}">{{m.title}}</span>
            <span style="font-size: 11px; font-weight: 700; color: #6F5B6A;">{{m.count}}</span>
          </span>
          <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, 9px); gap: 3px;">
            <sc-for list="{{m.dots}}" as="d" hint-placeholder-count="35">
              <span style="{{d.style}}"></span>
            </sc-for>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px;">
    <dc-import name="TabBar" active="journal" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const COUNTS = [3, 6, 4, 2, 5, 3, 1, 4, 3, 9, 5, 3];
    const seed = (m, d) => (m * 37 + d * 17) % 11;
    const months = COUNTS.map((count, m) => {
      const days = new Date(2026, m + 1, 0).getDate();
      const off = (new Date(2026, m, 1).getDay() + 6) % 7;
      const total = Math.ceil((off + days) / 7) * 7;
      const dots = [];
      for (let i = 0; i < total; i++) {
        const d = i - off + 1;
        let bg = 'transparent';
        if (d >= 1 && d <= days) {
          const s = seed(m, d);
          bg = s < count * 0.6 ? (s % 2 ? '#E9557A' : '#F4A6BA') : '#EADFD9';
        }
        dots.push({ style: 'display: block; width: 9px; height: 9px; border-radius: 3px; background: ' + bg + ';' });
      }
      const now = m === 9;
      return {
        title: 'Th ' + (m + 1),
        count: String(count),
        aria: 'Tháng ' + (m + 1) + ', ' + count + ' kỷ niệm',
        dots,
        cardStyle: 'padding: 10px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(43,26,46,0.06); display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #2B1A2E; border: 2px solid ' + (now ? '#E9557A' : 'transparent') + ';',
        titleStyle: 'font-size: 14px; font-weight: 700; color: ' + (now ? '#C9365C' : '#2B1A2E') + ';',
      };
    });
    return { months };
  }
}
</script>
</body>
</html>
