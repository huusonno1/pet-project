<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tìm theo ID</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF8F3; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <div style="position: absolute; left: 24px; top: 52px; width: 342px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="A8-Trang-chu-solo.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(43,26,46,0.08); display: flex; align-items: center; justify-content: center; color: #2B1A2E;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700;">Tìm theo ID</h1>
    </div>

    <div style="padding: 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(43,26,46,0.06); display: flex; align-items: center; gap: 10px;">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6F5B6A;">ID CỦA BẠN</span>
        <span style="font-size: 18px; font-weight: 700; color: #C9365C;">@lan.2001</span>
      </span>
      <button type="button" aria-label="Sao chép ID" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFE6EC; color: #C9365C; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
      <button type="button" aria-label="Chia sẻ ID" style="font: inherit; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFE6EC; color: #C9365C; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg></button>
    </div>

    <label for="find-id" style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #C9365C;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F5B6A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Nhập ID người ấy</span>
      <input id="find-id" value="@minh.dev" style="font: inherit; flex-grow: 1; border: 0; outline: none; background: none; font-size: 15px; color: #2B1A2E;">
    </label>

    <div style="padding: 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(43,26,46,0.06); display: flex; align-items: center; gap: 12px;">
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #EEEAFF; color: #5B4BC4; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800;">M</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span style="font-size: 15px; font-weight: 700;">Minh</span>
        <span style="font-size: 13px; color: #6F5B6A;">@minh.dev</span>
      </span>
      <button type="button" onClick="{{toggleSent}}" style="{{sendStyle}}">{{sendLabel}}</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #EEEAFF;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B4BC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span style="font-size: 13px; color: #5B4BC4;">Chỉ tìm thấy khi nhập đúng chính xác ID. Có thể tắt trong Tôi → Quyền riêng tư.</span>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 18px; font-weight: 700;">Lời mời đã nhận</h2>
    <div style="padding: 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(43,26,46,0.06); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #FFEEDF; color: #B5562A; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0;">H</span>
        <span style="display: flex; flex-direction: column;">
          <span style="font-size: 15px; font-weight: 700;">Hoàng muốn ghép đôi với bạn</span>
          <span style="font-size: 13px; color: #6F5B6A;">@hoang.98 · 2 giờ trước</span>
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" style="font: inherit; height: 48px; border-radius: 16px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 15px; font-weight: 700; cursor: pointer;">Từ chối</button>
        <a href="A6-Thanh-cong.dc.html" style="height: 48px; border-radius: 16px; background: #C9365C; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Đồng ý</a>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; color: #6F5B6A;">Lời mời hết hạn sau 24 giờ. Bạn chỉ ghép đôi được với 1 người tại một thời điểm.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent;
    return {
      toggleSent: () => this.setState({ sent: !sent }),
      sendLabel: sent ? 'Đã gửi · chờ' : 'Gửi lời mời',
      sendStyle: 'font: inherit; height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 700; ' +
        (sent ? 'border: 1.5px solid #EADFD9; background: #FFFFFF; color: #6F5B6A;' : 'border: 0; background: #C9365C; color: #FFFFFF;'),
    };
  }
}
</script>
</body>
</html>
