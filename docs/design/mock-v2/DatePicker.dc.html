<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Popup lịch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section aria-label="{{title}}" style="width: 390px; box-sizing: border-box; padding: 12px 24px 34px; background: #FFF8F3; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 14px; font-family: 'Be Vietnam Pro', sans-serif; color: #2B1A2E;">
  <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #EADFD9; align-self: center;"></div>
  <h2 style="margin: 0; font-size: 21px; font-weight: 700;">{{title}}</h2>

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <button type="button" style="font: inherit; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 14px; border-radius: 999px; border: 0; background: #F6EEEA; color: #2B1A2E; font-size: 15px; font-weight: 700; cursor: pointer;">
      {{monthLabel}}
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div style="display: flex; gap: 8px;">
      <button type="button" aria-label="Tháng trước" style="font: inherit; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button type="button" aria-label="Tháng sau" style="font: inherit; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 12px 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px;">
    <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
      <span style="{{w.style}}">{{w.label}}</span>
    </sc-for>
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
      <span style="display: flex; align-items: center; justify-content: center; height: 42px;">
        <sc-if value="{{c.has}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.label}}</button>
        </sc-if>
      </span>
    </sc-for>
  </div>

  <sc-if value="{{withTime}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px; background: #FFFFFF;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F5B6A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700;">Giờ</span>
      <span style="display: flex; align-items: center; gap: 6px;">
        <button type="button" aria-label="Giờ" style="font: inherit; width: 54px; height: 42px; border-radius: 12px; border: 0; background: #FFE6EC; color: #C9365C; font-size: 21px; font-weight: 700;">19</button>
        <span style="font-size: 21px; font-weight: 700;">:</span>
        <button type="button" aria-label="Phút" style="font: inherit; width: 54px; height: 42px; border-radius: 12px; border: 0; background: #FFE6EC; color: #C9365C; font-size: 21px; font-weight: 700;">00</button>
      </span>
    </div>
  </sc-if>

  <sc-if value="{{withQuick}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; gap: 8px;">
      <button type="button" style="font: inherit; height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 13px; font-weight: 600;">Hôm nay</button>
      <button type="button" style="font: inherit; height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 13px; font-weight: 600;">Hôm qua</button>
      <button type="button" style="font: inherit; height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 13px; font-weight: 600;">Đầu tháng này</button>
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <a href="{{cancelHref}}" style="height: 52px; border-radius: 18px; border: 1.5px solid #EADFD9; background: #FFFFFF; color: #2B1A2E; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Huỷ</a>
    <a href="{{confirmHref}}" style="height: 52px; border-radius: 18px; background: #C9365C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Xác nhận</a>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Chọn ngày bắt đầu yêu"},"mode":{"editor":"enum","options":["date","datetime"],"default":"date"},"monthLabel":{"editor":"text","default":"Tháng 2, 2025"},"offset":{"editor":"int","min":0,"max":6,"default":5},"days":{"editor":"int","min":28,"max":31,"default":28},"selected":{"editor":"int","min":1,"max":31,"default":14},"quick":{"editor":"boolean","default":true},"confirmHref":{"editor":"text","default":"#"},"cancelHref":{"editor":"text","default":"#"},"$preview":{"width":390,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null };
  }
  renderVals() {
    const offset = this.props.offset ?? 5;
    const days = this.props.days ?? 28;
    const sel = this.state.sel ?? this.props.selected ?? 14;
    const total = Math.ceil((offset + days) / 7) * 7;
    const cells = [];
    for (let i = 0; i < total; i++) {
      const d = i - offset + 1;
      const has = d >= 1 && d <= days;
      const on = d === sel;
      const sunday = i % 7 === 6;
      cells.push({
        has,
        label: has ? String(d) : '',
        aria: 'Ngày ' + d,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ sel: d }),
        style: 'font: inherit; width: 38px; height: 38px; border-radius: 19px; border: 0; cursor: pointer; font-size: 15px; font-weight: ' + (on ? '700' : '500') + '; ' +
          (on ? 'background: #C9365C; color: #FFFFFF; box-shadow: 0 4px 10px rgba(201,54,92,0.35);' : 'background: transparent; color: ' + (sunday ? '#C9365C' : '#2B1A2E') + ';'),
      });
    }
    const weekdays = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((label) => ({
      label,
      style: 'text-align: center; padding: 4px 0 6px; font-size: 11px; font-weight: 700; color: ' + (label === 'CN' ? '#C9365C' : '#6F5B6A') + ';',
    }));
    return {
      title: this.props.title ?? 'Chọn ngày bắt đầu yêu',
      monthLabel: this.props.monthLabel ?? 'Tháng 2, 2025',
      weekdays,
      cells,
      withTime: (this.props.mode ?? 'date') === 'datetime',
      withQuick: this.props.quick ?? true,
      confirmHref: this.props.confirmHref ?? '#',
      cancelHref: this.props.cancelHref ?? '#',
    };
  }
}
</script>
</body>
</html>
